<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>LAPO Apartments — Guest Guide</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">
  <img src="logo.png" alt="Logo" class="sidebar-logo">
  <a class="menu-link active" id="nav-info" onclick="switchPage('info')">
    <i class="fas fa-home"></i> <span data-i18n="nav_info">Info Appartamento</span>
  </a>
  <a class="menu-link" id="nav-transport" onclick="switchPage('transport')">
    <i class="fas fa-subway"></i> <span data-i18n="nav_transport">Trasporti & Attrazioni</span>
  </a>
</div>

<button class="top-fab fab-left" onclick="openMenu()"><i class="fas fa-bars"></i></button>
<button class="top-fab fab-right" id="lang-fab" onclick="toggleLangDrawer()"><i class="fas fa-language"></i></button>

<div class="lang-drawer" id="lang-drawer">
  <button class="lang-btn active" data-lang="it">🇮🇹 Italiano</button>
  <button class="lang-btn" data-lang="en">🇬🇧 English</button>
  <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
  <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
</div>

<button class="host-fab" id="host-fab" onclick="toggleHostDrawer()"><i class="fab fa-whatsapp"></i></button>
<div class="host-drawer" id="host-drawer">
  <div class="host-drawer-label" data-i18n="hostLabel">Il tuo Host</div>
  <a href="https://wa.me/393480004094" target="_blank" class="host-action-btn wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  <a href="tel:+393480004094" class="host-action-btn call"><i class="fas fa-phone"></i> <span data-i18n="callHost">Chiama</span></a>
</div>

<button class="emerg-fab" id="emerg-fab" onclick="toggleEmergDrawer()"><i class="fas fa-life-ring"></i></button>
<div class="emerg-drawer" id="emerg-drawer">
  <div class="emerg-drawer-label" data-i18n="phones_title">Numeri Utili</div>
  <a href="tel:028585" class="host-action-btn call"><i class="fas fa-taxi"></i> <span data-i18n="phone_taxi_short">Taxi: 02 8585</span></a>
  <a href="tel:0229400513" class="host-action-btn pharma"><i class="fas fa-pills"></i> <span data-i18n="phone_pharma_short">Farmacia: 02 29400 513</span></a>
  <a href="tel:112" class="host-action-btn emerg"><i class="fas fa-star-of-life"></i> <span data-i18n="phone_emerg_short">Soccorso: 112</span></a>
</div>

<header class="header">
  <div class="logo-wrap"><img class="logo-img" src="logo.png" alt="LAPO Apartments"></div>
  <h1 id="main-title" data-i18n="headline_info">Informazioni Appartamento</h1>
  <div class="header-address">Via G.B. Pergolesi, 3 · Milano</div>
  <div class="gold-line"></div>
</header>

<div id="page-info" class="page-section active">
    </div>

<div id="page-transport" class="page-section">
    </div>

<script src="js/translations.js"></script>
<script src="js/main.js"></script>

</body>
</html>
